{% extends "base.html" %}
{% block title %}번호생성 - 로또 스틸의 법칙{% endblock %}
{% block content %}

<section class="text-center mb-8">
  <h1 class="text-3xl md:text-4xl font-extrabold mb-2">번호 생성기 🎲</h1>
  <p class="text-gray-500">1부터 45까지 중복 없이 6개, 원하는 방식으로 생성할 수 있어요.</p>
</section>

<section class="bg-white rounded-2xl shadow-md p-6 md:p-8">
  <div class="flex flex-wrap gap-2 justify-center mb-6">
    <button data-mode="random" class="mode-btn px-4 py-2 rounded-full bg-indigo-600 text-white font-bold text-sm">완전 무작위</button>
    <button data-mode="hot" class="mode-btn px-4 py-2 rounded-full bg-gray-100 text-gray-700 font-bold text-sm">자주 나온 번호 가중</button>
    <button data-mode="overdue" class="mode-btn px-4 py-2 rounded-full bg-gray-100 text-gray-700 font-bold text-sm">오래 안나온 번호 가중</button>
    <button data-mode="hybrid" class="mode-btn px-4 py-2 rounded-full bg-gray-100 text-gray-700 font-bold text-sm">하이브리드</button>
  </div>

  <div id="ball-result" class="flex flex-wrap gap-3 justify-center min-h-[64px] items-center mb-4">
    <span class="text-gray-300">버튼을 눌러 번호를 생성해보세요</span>
  </div>

  <p id="strategy-label" class="text-center text-xs text-gray-400 mb-6 h-4"></p>

  <div class="flex flex-wrap gap-3 justify-center">
    <button id="generate-btn" class="px-8 py-3 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow-lg shadow-indigo-200 transition">
      🎲 번호 생성하기
    </button>
    <button id="save-btn" class="px-8 py-3 rounded-full bg-white border-2 border-indigo-600 text-indigo-600 font-bold transition hover:bg-indigo-50">
      💾 내 번호함에 저장
    </button>
  </div>

  <p class="text-center text-[11px] text-gray-400 mt-4">
    ※ 통계 기반 옵션도 참고용이며, 모든 번호 조합의 당첨 확률은 수학적으로 동일합니다.
  </p>
</section>

{% endblock %}

{% block scripts %}
<script>
let currentMode = "random";
let lastNumbers = null;

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentMode = btn.dataset.mode;
    document.querySelectorAll(".mode-btn").forEach(b => {
      b.classList.remove("bg-indigo-600", "text-white");
      b.classList.add("bg-gray-100", "text-gray-700");
    });
    btn.classList.remove("bg-gray-100", "text-gray-700");
    btn.classList.add("bg-indigo-600", "text-white");
  });
});

function renderBalls(container, balls) {
  container.innerHTML = "";
  balls.forEach((b, i) => {
    const el = document.createElement("div");
    el.className = `ball ball-anim ball-${b.color}`;
    el.style.animationDelay = `${i * 0.08}s`;
    el.textContent = b.number;
    container.appendChild(el);
  });
}

document.getElementById("generate-btn").addEventListener("click", async () => {
  const res = await fetch(`/api/generate?mode=${currentMode}`);
  const data = await res.json();
  renderBalls(document.getElementById("ball-result"), data.balls);
  document.getElementById("strategy-label").textContent =
    `방식: ${data.strategy} · ${data.disclaimer}`;
  lastNumbers = data.numbers;
});

document.getElementById("save-btn").addEventListener("click", async () => {
  if (!lastNumbers) { alert("먼저 번호를 생성해주세요."); return; }
  const res = await fetch("/api/saved", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ numbers: lastNumbers, memo: `번호생성기(${currentMode})`, source: "generate" })
  });
  const data = await res.json();
  if (!res.ok) { alert(data.error); return; }
  alert("내 번호함에 저장했어요!");
});
</script>
{% endblock %}
