<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f46e5">
<title>오프라인 · 로또 스틸의 법칙</title>
<link rel="icon" href="{{ static_v('favicon.png') }}" type="image/png">
<style>
  /* 서비스워커가 오프라인일 때 보여주는 페이지라 외부 CSS/JS에 의존하지 않고
     전부 인라인으로 둔다(base.html의 안전망 CSS와 같은 이유). */
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, #eef2ff 0%, #ffffff 60%);
    color: #1f2937; padding: 24px;
  }
  .card {
    max-width: 380px; text-align: center; background: #fff; border-radius: 20px;
    padding: 36px 28px; box-shadow: 0 12px 40px rgba(79, 70, 229, 0.12);
    border: 1px solid #e5e7eb;
  }
  .emoji { font-size: 44px; }
  h1 { font-size: 19px; margin: 14px 0 8px; }
  p { font-size: 13px; line-height: 1.7; color: #6b7280; margin: 0 0 22px; }
  button {
    background: #4f46e5; color: #fff; border: 0; border-radius: 999px;
    padding: 11px 26px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button:hover { background: #4338ca; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">📡</div>
    <h1>지금은 오프라인이에요</h1>
    <p>
      인터넷 연결이 끊겨서 최신 당첨번호·통계를 불러올 수 없어요.<br>
      연결이 돌아오면 아래 버튼으로 다시 시도해주세요.
    </p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
  <script>
    // 온라인 복귀가 감지되면 자동으로 새로고침.
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
