    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);

        }

            gap: 20px;
        }

        .stage-column {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }

            color: var(--accent-color);

            margin-bottom: 15px;
        }

            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tool-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .tool-card.active {
            border-color: #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);

        .tool-name {

        }

        .tool-cat {

        .badge {

            padding: 2px 6px;
            border-radius: 4px;

            color: #e2e8f0;

// CSV 파서 함수
function parseCSV(text) {
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',');
    const result = [];

    for (let i = 1; i < lines.length; i++) {
        if (!lines[i]) continue;
        const currentline = lines[i].split(',');
        const obj = {};
        for (let j = 0; j < headers.length; j++) {
            obj[headers[j].trim()] = currentline[j] ? currentline[j].trim() : '';
        }
        result.push(obj);
    }
    return result;
}

// 화면 렌더링
function renderRoadmap(data) {
    const grid = document.getElementById('pipelineGrid');
    grid.innerHTML = '';

    // ai_type을 기준으로 그룹화
    const stages = {};
    data.forEach(item => {
        if (!stages[item.ai_type]) {
            stages[item.ai_type] = [];
        }
        stages[item.ai_type].push(item);
    });

    // 각 단계별 칼럼 생성
    Object.keys(stages).forEach(stageName => {
        const col = document.createElement('div');
        col.className = 'stage-column';
        
        const title = document.createElement('div');
        title.className = 'stage-title';
        title.innerText = stageName;
        col.appendChild(title);

        stages[stageName].forEach(tool => {
            const card = document.createElement('div');
            card.className = 'tool-card';
            card.id = `card-${tool.id}`;
            card.innerHTML = `
                <div class="tool-name">${tool.tool_name}</div>
                <div class="tool-cat">${tool.channel_type}</div>
                <div class="tool-desc">${tool.description}</div>
                <div class="badge">${tool.best_pricing}</div>
            `;

            // 클릭 시 연결된 다음 단계 하이라이트
            card.addEventListener('click', () => {
                document.querySelectorAll('.tool-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');

                if (tool.next_ids && tool.next_ids !== 'END') {
                    const nextList = tool.next_ids.split('|');
                    nextList.forEach(nextId => {
                        const target = document.getElementById(`card-${nextId}`);
                        if (target) target.classList.add('active');
                    });
                }
            });

            col.appendChild(card);
        });

        grid.appendChild(col);
    });
}

// 실행
document.addEventListener('DOMContentLoaded', () => {
    const parsedData = parseCSV(embeddedData);
    renderRoadmap(parsedData);
});
</script>
