<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>올인원 센스있는 영문 명칭 변환기</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex; justify-content: center; align-items: flex-start; 
            min-height: 100vh; margin: 0; padding: 40px 20px; 
        }
        .container { 
            background: #ffffff; padding: 40px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            width: 100%; max-width: 920px; 
        }
        h1 { font-size: 28px; margin-bottom: 8px; color: #1e293b; text-align: center; font-weight: 800; }
        p.subtitle { font-size: 15px; color: #64748b; text-align: center; margin-bottom: 28px; }
        
        .input-group { display: flex; gap: 12px; margin-bottom: 24px; }
        input[type="text"] { 
            flex: 1; padding: 16px 20px; border: 2px solid #e2e8f0; border-radius: 12px; 
            font-size: 16px; outline: none; transition: all 0.2s;
        }
        input[type="text"]:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); }
        button { 
            padding: 16px 32px; background-color: #6366f1; color: white; border: none; 
            border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s;
            white-space: nowrap;
        }
        button:hover { background-color: #4f46e5; transform: translateY(-1px); }

        .category-tabs { 
            display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; 
            background-color: #f8fafc; padding: 12px; border-radius: 14px; border: 1px solid #f1f5f9;
        }
        .chip { 
            padding: 8px 16px; border-radius: 10px; background-color: #ffffff; 
            font-size: 13px; color: #475569; cursor: pointer; border: 1px solid #e2e8f0;
            font-weight: 500; transition: all 0.2s; user-select: none;
        }
        .chip:hover { background-color: #f1f5f9; border-color: #cbd5e1; }
        .chip.active { background-color: #6366f1; color: white; border-color: #6366f1; font-weight: 700; }

        .results { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px;
            max-height: 600px; overflow-y: auto; padding-right: 4px;
        }
        .result-card { 
            background: #ffffff; border: 1px solid #e2e8f0; padding: 14px 16px; 
            border-radius: 12px; display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s;
        }
        .result-card:hover { border-color: #c7d2fe; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.08); transform: translateY(-2px); }
        .info { display: flex; flex-direction: column; gap: 4px; overflow: hidden; padding-right: 8px; }
        .name { font-size: 15px; font-weight: 700; color: #0f172a; word-break: break-all; }
        .desc { font-size: 12px; color: #64748b; }
        
        .copy-btn { 
            background: #f8fafc; color: #475569; border: 1px solid #cbd5e1; 
            padding: 6px 12px; font-size: 12px; border-radius: 8px; cursor: pointer;
            font-weight: 600; white-space: nowrap; transition: all 0.2s;
        }
        .copy-btn:hover { background: #6366f1; color: white; border-color: #6366f1; }
        .empty-state { grid-column: 1 / -1; text-align: center; color: #94a3b8; font-size: 15px; padding: 50px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ 올인원 센스있는 영문 명칭 변환기</h1>
    <p class="subtitle">한글 단어를 입력하면 카테고리별 최소 10개 이상의 다양한 명칭을 추천합니다.</p>

    <div class="input-group">
        <input type="text" id="koreanInput" placeholder="예: 구름, 그림자, 번개, 사자, 돈..." onkeypress="if(event.key==='Enter') generateNames()">
        <button onclick="generateNames()">변환하기</button>
    </div>

    <div class="category-tabs">
        <div class="chip active" onclick="filterCategory('all', this)">전체보기</div>
        <div class="chip" onclick="filterCategory('greek', this)">🏛️ 그리스 신화</div>
        <div class="chip" onclick="filterCategory('astro', this)">🌌 별자리 / 별</div>
        <div class="chip" onclick="filterCategory('nature', this)">🌿 동식물 / 자연</div>
        <div class="chip" onclick="filterCategory('econ', this)">📈 경제 / 금융</div>
        <div class="chip" onclick="filterCategory('novel', this)">📖 소설 / 세계관</div>
        <div class="chip" onclick="filterCategory('dev', this)">💻 코드 / 개발</div>
        <div class="chip" onclick="filterCategory('brand', this)">🏷️ 브랜드 / 서비스</div>
        <div class="chip" onclick="filterCategory('sns', this)">✨ 감성 / 소셜</div>
    </div>

    <div class="results" id="resultsList">
        <div class="empty-state">한글 단어를 입력하고 [변환하기]를 눌러보세요.</div>
    </div>
</div>

<script>
    const dictionary = {
        "구름": { base: "cloud", syn: ["cumulus", "nebula", "nimbus"] },
        "파도": { base: "wave", syn: ["surge", "tide", "tsunami"] },
        "새벽": { base: "dawn", syn: ["aurora", "twilight", "daybreak"] },
        "별": { base: "star", syn: ["astro", "nova", "stellar"] },
        "별빛": { base: "starlight", syn: ["glimmer", "aster", "asteria"] },
        "바람": { base: "wind", syn: ["breeze", "zephyr", "boreas"] },
        "달": { base: "moon", syn: ["lunar", "selene", "artemis"] },
        "불꽃": { base: "flame", syn: ["blaze", "ember", "phoenix"] },
        "빛": { base: "light", syn: ["glow", "lumens", "apollo"] },
        "숲": { base: "forest", syn: ["grove", "sylvan", "dryad"] },
        "바다": { base: "sea", syn: ["ocean", "abyss", "poseidon"] },
        "그림자": { base: "shadow", syn: ["shade", "umbra", "erebus"] },
        "환상": { base: "illusion", syn: ["phantom", "mirage", "chimera"] },
        "눈꽃": { base: "snowflake", syn: ["frost", "glacier", "crystal"] },
        "번개": { base: "lightning", syn: ["thunder", "bolt", "zeus"] },
        "돈": { base: "money", syn: ["capital", "wealth", "asset"] },
        "사자": { base: "lion", syn: ["leo", "apex", "regal"] }
    };

    let currentCategory = 'all';

    function filterCategory(cat, el) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        currentCategory = cat;
        generateNames();
    }

    async function fetchTranslation(text) {
        try {
            const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ko|en`);
            const data = await response.json();
            if (data && data.responseData && data.responseData.translatedText) {
                return data.responseData.translatedText.toLowerCase().replace(/[^a-z]/g, '');
            }
        } catch (e) {
            console.log("번역 API 통신 에러");
        }
        return null;
    }

    async function generateNames() {
        const input = document.getElementById('koreanInput').value.trim();
        const resultsList = document.getElementById('resultsList');

        if (!input) {
            resultsList.innerHTML = '<div class="empty-state">한글 단어를 입력해주세요!</div>';
            return;
        }

        resultsList.innerHTML = '<div class="empty-state">신화, 별자리, 경제 어휘를 풍부하게 조합하는 중...</div>';

        let baseWord = "";
        let synonyms = ["prime", "core", "vibe"];

        if (dictionary[input]) {
            baseWord = dictionary[input].base;
            synonyms = dictionary[input].syn;
        } else {
            const translated = await fetchTranslation(input);
            baseWord = translated || "realm";
        }

        const capitalized = baseWord.charAt(0).toUpperCase() + baseWord.slice(1);
        const upperCase = baseWord.toUpperCase();
        const synCap = synonyms[0] ? synonyms[0].charAt(0).toUpperCase() + synonyms[0].slice(1) : capitalized;
        const syn2Cap = synonyms[1] ? synonyms[1].charAt(0).toUpperCase() + synonyms[1].slice(1) : capitalized;

        const candidates = [
            // 🏛️ 그리스 신화 (10개)
            { name: `${capitalized} of Olympus`, desc: "올림포스 신화풍 명칭", cat: "greek" },
            { name: `${synCap}us`, desc: "남성 신/영웅 스타일 명칭", cat: "greek" },
            { name: `${capitalized}ia`, desc: "여신 및 신화속 영지 이름", cat: "greek" },
            { name: `Aegis of ${synCap}`, desc: "수호/방패 수식어 명칭", cat: "greek" },
            { name: `Temple of ${capitalized}`, desc: "신전 및 성역 스타일", cat: "greek" },
            { name: `${syn2Cap} Oread`, desc: "자연의 정령/닌프 스타일", cat: "greek" },
            { name: `Oracle ${capitalized}`, desc: "신탁/예언자 느낌 명칭", cat: "greek" },
            { name: `Titan ${synCap}`, desc: "거신/거대 세력 이미지", cat: "greek" },
            { name: `Ambrosia ${capitalized}`, desc: "신들의 음료/신성한 느낌", cat: "greek" },
            { name: `${capitalized} Elysium`, desc: "낙원/이상향 스타일", cat: "greek" },

            // 🌌 별자리 / 별 (10개)
            { name: `${synCap}is Major`, desc: "주요 별자리/성좌 스타일", cat: "astro" },
            { name: `Nebula ${capitalized}`, desc: "성운 및 우주 공간 이미지", cat: "astro" },
            { name: `${capitalized} Polaris`, desc: "북극성/중심축 이정표", cat: "astro" },
            { name: `Alpha ${syn2Cap}`, desc: "가장 밝은 항성 칭호", cat: "astro" },
            { name: `${capitalized} Constellation`, desc: "성좌 그룹 명칭", cat: "astro" },
            { name: `Orbit of ${synCap}`, desc: "궤도/순환 스타일", cat: "astro" },
            { name: `${syn2Cap} Cluster`, desc: "성단/은하단 느낌", cat: "astro" },
            { name: `Cosmic ${capitalized}`, desc: "우주적/거대한 이미지", cat: "astro" },
            { name: `Zenith ${synCap}`, desc: "천정/최고점 천체 칭호", cat: "astro" },
            { name: `${capitalized} Zenith`, desc: "정점의 별 이미지", cat: "astro" },

            // 🌿 동식물 / 자연 (10개)
            { name: `Flora ${capitalized}`, desc: "식물학/보타닉 스타일", cat: "nature" },
            { name: `${synCap}is`, desc: "라틴어 생물 학명 느낌", cat: "nature" },
            { name: `Wild ${capitalized}`, desc: "야생/자연주의 에코 스타일", cat: "nature" },
            { name: `${syn2Cap} Eco`, desc: "친환경 생태계 강조", cat: "nature" },
            { name: `Bloom ${capitalized}`, desc: "개화/성장 자연 이미지", cat: "nature" },
            { name: `Fauna ${synCap}`, desc: "동물군/생명력 네이밍", cat: "nature" },
            { name: `${capitalized} Roots`, desc: "뿌리/근본 상징 스타일", cat: "nature" },
            { name: `Sylvan ${syn2Cap}`, desc: "숲의/자연주의 명칭", cat: "nature" },
            { name: `Verdant ${capitalized}`, desc: "신록/푸르른 이미지", cat: "nature" },
            { name: `${synCap} Canopy`, desc: "숲의 지붕/포근한 자연", cat: "nature" },

            // 📈 경제 / 금융 (10개)
            { name: `${capitalized} Capital`, desc: "투자/자산운용사 스타일", cat: "econ" },
            { name: `${synCap} Index`, desc: "금융 지수/경제 지표", cat: "econ" },
            { name: `${capitalized} Pay`, desc: "핀테크/결제 플랫폼", cat: "econ" },
            { name: `Yield ${syn2Cap}`, desc: "수익률/자산증식 강조", cat: "econ" },
            { name: `${capitalized} Holding`, desc: "지주회사/그룹 스타일", cat: "econ" },
            { name: `Asset ${synCap}`, desc: "자산/가치 중심 네이밍", cat: "econ" },
            { name: `${syn2Cap} Equity`, desc: "사모펀드/지분 투자사", cat: "econ" },
            { name: `Venture ${capitalized}`, desc: "벤처 투자/스타트업 펀드", cat: "econ" },
            { name: `${capitalized} Trust`, desc: "신뢰/신탁 금융 기관", cat: "econ" },
            { name: `Bullish ${synCap}`, desc: "상승장/강세장 금융 네이밍", cat: "econ" },

            // 📖 소설 / 세계관 (10개)
            { name: `Lord of ${capitalized}`, desc: "판타지 작위 및 영웅 칭호", cat: "novel" },
            { name: `House of ${synCap}`, desc: "귀족 가문 및 세력 명칭", cat: "novel" },
            { name: `Grand ${syn2Cap}`, desc: "전설적인 마법/기사단", cat: "novel" },
            { name: `${capitalized}ia Empire`, desc: "제국/거대 국가 명칭", cat: "novel" },
            { name: `Chronicles of ${synCap}`, desc: "연대기/대서사시 제목", cat: "novel" },
            { name: `The ${capitalized} Knight`, desc: "주인공/기사 칭호", cat: "novel" },
            { name: `${syn2Cap} Realm`, desc: "이세계/차원 영지 이름", cat: "novel" },
            { name: `Sovereign ${capitalized}`, desc: "절대 군주/지배자 명칭", cat: "novel" },
            { name: `Order of ${synCap}`, desc: "성기사단/비밀 결사대", cat: "novel" },
            { name: `${capitalized} Citadel`, desc: "철옹성/요새 도시 이름", cat: "novel" },

            // 💻 코드 / 개발 (10개)
            { name: `is${capitalized}`, desc: "Boolean 변수 표현식", cat: "dev" },
            { name: `use${capitalized}`, desc: "React 커스텀 훅 명칭", cat: "dev" },
            { name: `${baseWord}Service`, desc: "비즈니스 로직 클래스 명", cat: "dev" },
            { name: `get${capitalized}()`, desc: "getter 함수/메서드 명", cat: "dev" },
            { name: `${baseWord}Handler`, desc: "이벤트 핸들러 함수 명", cat: "dev" },
            { name: `DEFAULT_${upperCase}`, desc: "전역 상수 (UPPER_CASE)", cat: "dev" },
            { name: `${baseWord}_config`, desc: "설정 파일용 snake_case", cat: "dev" },
            { name: `${capitalized}Controller`, desc: "API 컨트롤러 클래스", cat: "dev" },
            { name: `fetch${capitalized}`, desc: "비동기 데이터 요청 함수", cat: "dev" },
            { name: `${baseWord}Adapter`, desc: "디자인 패턴 어댑터 클래스", cat: "dev" },

            // 🏷️ 브랜드 / 서비스 (10개)
            { name: `${capitalized}ly`, desc: "트렌디한 스타트업 스타일", cat: "brand" },
            { name: `${capitalized}Lab`, desc: "연구소/전문성 강조", cat: "brand" },
            { name: `${capitalized}ify`, desc: "서비스화/유틸리티 강조", cat: "brand" },
            { name: `Re${baseWord}`, desc: "재창조/혁신 브랜드명", cat: "brand" },
            { name: `${capitalized}Hub`, desc: "플랫폼/거점 중심 서비스", cat: "brand" },
            { name: `Hyper${capitalized}`, desc: "차세대/고성능 강조", cat: "brand" },
            { name: `${capitalized} Studio`, desc: "크리에이티브 브랜드", cat: "brand" },
            { name: `Next ${synCap}`, desc: "미래지향적 라인업 명칭", cat: "brand" },
            { name: `${capitalized} Works`, desc: "공방/에이전시 네이밍", cat: "brand" },
            { name: `Meta ${syn2Cap}`, desc: "메타버스/초월적 브랜드", cat: "brand" },

            // ✨ 감성 / 소셜 (10개)
            { name: `dear.${baseWord}`, desc: "감성 인스타그램/블로그", cat: "sns" },
            { name: `by.${baseWord}`, desc: "포트폴리오/스튜디오 아이디", cat: "sns" },
            { name: `${baseWord}.room`, desc: "아늑한 프라이빗 공간", cat: "sns" },
            { name: `pure_${baseWord}`, desc: "순수하고 깔끔한 감성", cat: "sns" },
            { name: `${baseWord}_daily`, desc: "일상 기록용 계정 아이디", cat: "sns" },
            { name: `${baseWord}_archive`, desc: "아카이브/수집용 계정", cat: "sns" },
            { name: `studio.${baseWord}`, desc: "디자이너/아티스트 계정", cat: "sns" },
            { name: `the.${baseWord}.club`, desc: "독창적 커뮤니티 아이디", cat: "sns" },
            { name: `ordinary.${baseWord}`, desc: "잔잔한 일상 브랜드/계정", cat: "sns" },
            { name: `project_${baseWord}`, desc: "개인 프로젝트/작업물 계정", cat: "sns" }
        ];

        const filtered = currentCategory === 'all' ? candidates : candidates.filter(c => c.cat === currentCategory);

        resultsList.innerHTML = "";
        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `
                <div class="info">
                    <span class="name">${item.name}</span>
                    <span class="desc">${item.desc}</span>
                </div>
                <button class="copy-btn" onclick="copyToClipboard('${item.name}', this)">복사</button>
            `;
            resultsList.appendChild(card);
        });
    }

    function copyToClipboard(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            const originalText = btn.innerText;
            btn.innerText = "복사됨!";
            btn.style.backgroundColor = "#6366f1";
            btn.style.color = "#ffffff";
            btn.style.borderColor = "#6366f1";
            setTimeout(() => { 
                btn.innerText = originalText;
                btn.style.backgroundColor = "#f8fafc";
                btn.style.color = "#475569";
                btn.style.borderColor = "#cbd5e1";
            }, 1000);
        });
    }
</script>

</body>
</html>
